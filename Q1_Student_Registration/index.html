<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🎓 Student Registration Portal</h1>
    <p>College Admission and Student Registration System</p>
</header>

<div class="container">

    <div class="form-card">

        <h2>Student Registration</h2>
        <p class="subtitle">
            Enter your details to register for admission
        </p>

        <form id="registrationForm">

            <div class="form-group">
                <label>Student Name</label>
                <input type="text" id="name"
                       placeholder="Enter student name">
                <small id="nameError"></small>
            </div>

            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" id="roll"
                       placeholder="Enter roll number">
                <small id="rollError"></small>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email"
                       placeholder="example@gmail.com">
                <small id="emailError"></small>
            </div>

            <div class="form-group">
                <label>Course</label>

                <select id="course">
                    <option value="">Select Course</option>
                    <option>B.E Computer Science</option>
                    <option>B.E Electronics</option>
                    <option>B.E Mechanical</option>
                    <option>B.Tech Information Technology</option>
                </select>

                <small id="courseError"></small>
            </div>

            <div class="form-group">
                <label>Upload Profile Document</label>

                <input type="file" id="file"
                       accept=".jpg,.jpeg,.png,.pdf">

                <small id="fileError"></small>
            </div>

            <div id="successMessage"></div>

            <div class="buttons">

                <button type="reset" class="reset">
                    Reset
                </button>

                <button type="submit" class="submit">
                    Register Student
                </button>

            </div>

        </form>

    </div>

</div>

<footer>
    <p>Web Technology Assignment | Student Admission Portal</p>
</footer>

<script src="script.js"></script>

</body>
</html>
